name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version | tee xcode-version.log
          xcrun --sdk iphoneos --show-sdk-version | tee -a xcode-version.log

      - name: Clean Xcode caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/BarometerPressureApp-*
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          rm -rf build/DerivedData
          mkdir -p build/logs

      - name: Reset checkout and clean Xcode caches
        run: |
          git reset --hard HEAD
          git clean -ffdx
          rm -rf ~/Library/Developer/Xcode/DerivedData/BarometerPressureApp-*
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          rm -rf build/DerivedData

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          mkdir -p build/logs

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PP_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/cf361b6c-f7a7-4c88-9fc6-6364e7927102.mobileprovision

          echo "Installed signing identities:"
          security find-identity -v -p codesigning | tee build/logs/signing-identities.log

          echo "Provisioning profile info:"
          security cms -D -i "$PP_PATH" > build/logs/profile-decoded.plist || true

      - name: Archive app
        run: |
          set -o pipefail
          mkdir -p build build/logs

          ARCHIVE_PATH="$PWD/build/BarometerPressureApp.xcarchive"
          rm -rf "$ARCHIVE_PATH"

          xcodebuild archive \
            -project BarometerPressureApp.xcodeproj \
            -scheme BarometerPressureApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="DH52HKR3ND" \
            PRODUCT_BUNDLE_IDENTIFIER="com.serban.barometer" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Barometer App Store Profile" \
            2>&1 | tee build/logs/archive-full.log

          echo "Archive path: $ARCHIVE_PATH"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Archive was not created. Existing build folders:"
            find build -maxdepth 4 -type d -print || true
            exit 65
          fi

      - name: Create export options
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>DH52HKR3ND</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.serban.barometer</key>
              <string>Barometer App Store Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

          cp ExportOptions.plist build/logs/ExportOptions.plist

      - name: Export IPA
        run: |
          set -o pipefail
          mkdir -p build/export build/logs

          ARCHIVE_PATH="$PWD/build/BarometerPressureApp.xcarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Archive missing before export: $ARCHIVE_PATH"
            find build -maxdepth 4 -type d -print || true
            exit 65
          fi

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee build/logs/export-full.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BarometerPressureApp-build-logs
          path: build/logs/*.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BarometerPressureApp-IPA
          path: build/export/*.ipa

      - name: Upload IPA to App Store Connect
        if: success()
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p private_keys
          echo "$APPSTORE_PRIVATE_KEY" > private_keys/AuthKey_$APPSTORE_KEY_ID.p8

          xcrun altool --upload-app \
            --type ios \
            --file build/export/*.ipa \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
